[package]
name = "cmux-moshi"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
description = "Moshi host integration for cmux: friendly workspace titles on tmux sessions"
license = "MIT"
repository = "https://github.com/RaviTharuma/cmux-moshi"
default-run = "cmux-moshi"

[[bin]]
name = "cmux-moshi"
path = "src/main.rs"

[[bin]]
name = "cmux-moshi-sidebar"
path = "src/sidebar_main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cmux-client = "0.1.2"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
