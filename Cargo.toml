[package]
name = "cmux-moshi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Official cmux plugin for Moshi: friendly workspace titles on tmux sessions"
license = "MIT"
repository = "https://github.com/RaviTharuma/cmux-moshi"
default-run = "cmux-moshi"

[[bin]]
name = "cmux-moshi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
