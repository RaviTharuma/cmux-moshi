# Publish versioned CLI binaries for bin/cmux-moshi-fetch.
# Official plugin [build] remains `cargo build --release` in cmux-plugin.toml.
# Asset names must match bin/cmux-moshi-fetch: cmux-moshi-$VERSION-$TARGET + SHA256SUMS.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish assets for (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          EXPECTED="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "VERSION ($TAG) does not match tag ($EXPECTED)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=cmux-moshi-${VERSION}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --bin cmux-moshi --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target }}/release/cmux-moshi"
          DEST="${{ steps.version.outputs.asset }}"
          cp "$SRC" "$DEST"
          chmod 755 "$DEST"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$DEST" > "${DEST}.sha256"
          else
            shasum -a 256 "$DEST" > "${DEST}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset }}
          path: |
            ${{ steps.version.outputs.asset }}
            ${{ steps.version.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cmux-moshi-*
          merge-multiple: true

      - name: Build SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -la
          : > SHA256SUMS
          for f in cmux-moshi-*; do
            case "$f" in
              *.sha256) continue ;;
            esac
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS
            else
              shasum -a 256 "$f" >> SHA256SUMS
            fi
          done
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "cmux-moshi ${{ steps.meta.outputs.version }}" \
              --notes "Contributor CLI binaries for \`bin/cmux-moshi-fetch\`. Official plugin install still uses \`cargo build --release\`."
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          cd dist
          # Replace prior assets on re-run so checksums stay consistent with binaries.
          gh release upload "$TAG" SHA256SUMS cmux-moshi-* \
            --clobber
