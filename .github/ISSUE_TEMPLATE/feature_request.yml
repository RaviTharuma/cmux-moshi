name: Feature request
description: Propose a change or new host CLI capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [CONTRIBUTING.md](https://github.com/RaviTharuma/cmux-moshi/blob/main/CONTRIBUTING.md)
        and [AGENTS.md](https://github.com/RaviTharuma/cmux-moshi/blob/main/AGENTS.md)
        for product boundaries (CLI-first Moshi host integration; not a left-sidebar Moshi panel).
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I accept DISCLAIMER.md and TERMS.md (maintainers have no liability for contributions or spend)
          required: true
        - label: This stays within cmux-moshi scope (host CLI / optional packaging), not a left-sidebar Moshi product
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should cmux-moshi behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related issues, environment notes.
    validations:
      required: false
